<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Data Peserta Trip 48</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body{font-family:Arial;margin:0;background:#f8fafc;color:#172033}
    header{background:#F88A08;color:#fff;padding:25px}
    main{max-width:1100px;margin:auto;padding:16px}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .hidden{display:none!important}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
    .card{padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer}
    .card:hover{background:#fff7ed;border-color:#fbbf24}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
    th{width:160px;color:#475569}
    button{padding:10px 14px;border:0;border-radius:8px;background:#F88A08;color:#fff;cursor:pointer}
    button.secondary{background:#e2e8f0;color:#172033}
    input{padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;width:90%;max-width:500px;margin-bottom:12px}
    #reader{margin-top:12px}
  </style>
</head>
<body>
  <header>
    <h1>Data Peserta Trip 48</h1>
    <p>Data peserta • QR pribadi • Absensi online</p>
  </header>

  <main>
    <div class="panel">
      <button type="button" onclick="show('list')">Daftar Peserta</button>
      <button type="button" onclick="show('scan')">Scan Absensi</button>
    </div>

    <section id="list" class="panel">
      <h2>Daftar Peserta</h2>
      <input id="q" placeholder="Cari nama / nomor peserta / bus...">
      <div id="cards" class="grid"></div>
    </section>

    <section id="detail" class="panel hidden"></section>

    <section id="scan" class="panel hidden">
      <h2>Scan QR Absensi</h2>
      <div id="reader" style="max-width:500px"></div>
      <div id="result"></div>
    </section>
  </main>

  <script>
    const participants = [
      {"No Peserta": "P001", "Nama": "Fauzan Pratama", "Perusahaan/Divisi": "Produksi", "No HP": 84332181960, "Bus": "Bus 01", "Seat": "1A", "TL": "Rizal", "Driver": "Budi", "Hotel": "Hotel A", "Check-in": "Aktif"},
      {"No Peserta": "P002", "Nama": "Riska Amelia", "Perusahaan/Divisi": "Marketing", "No HP": 82145678900, "Bus": "Bus 01", "Seat": "1B", "TL": "Rizal", "Driver": "Budi", "Hotel": "Hotel A", "Check-in": "Aktif"},
      {"No Peserta": "P003", "Nama": "Dimas Prakoso", "Perusahaan/Divisi": "IT", "No HP": 81299887766, "Bus": "Bus 02", "Seat": "2A", "TL": "Rizal", "Driver": "Budi", "Hotel": "Hotel B", "Check-in": "Belum"}
    ];

    const esc = x => String(x ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    let scanner = null;

    function show(id) {
      ['list', 'detail', 'scan'].forEach(x => {
        document.getElementById(x).classList.toggle('hidden', x !== id);
      });

      if (id === 'scan') startScan();
    }

    function render() {
      const q = document.getElementById('q').value.toLowerCase();
      const rows = participants.filter(p => Object.values(p).join(' ').toLowerCase().includes(q));

      const cards = rows.length
        ? rows.map(p => `
          <div class="card" onclick="detail('${esc(p['No Peserta'])}')">
            <strong>${esc(p.Nama)}</strong><br>
            <small>${esc(p['No Peserta'])}</small><br>
            <small>${esc(p.Bus)} • ${esc(p.Seat)}</small>
          </div>
        `).join('')
        : '<div class="card">Data tidak ditemukan</div>';

      document.getElementById('cards').innerHTML = cards;
    }

    function detail(id) {
      const p = participants.find(x => x['No Peserta'] === id);
      if (!p) return;

      show('detail');

      document.getElementById('detail').innerHTML = `
        <button type="button" onclick="show('list')">← Kembali</button>
        <h2>${esc(p.Nama)}</h2>
        <table>
          ${Object.entries(p).map(([k, v]) => `
            <tr>
              <th>${esc(k)}</th>
              <td>${esc(v)}</td>
            </tr>
          `).join('')}
        </table>

        <h3 style="text-align:center">QR Code Pribadi</h3>
        <div id="qr" style="display:flex;justify-content:center"></div>
      `;

      if (window.QRCode) {
        new QRCode(document.getElementById('qr'), {
          text: id,
          width: 220,
          height: 220
        });
      }
    }

    async function startScan() {
      if (scanner) return;
      if (!window.Html5Qrcode) return;

      scanner = new Html5Qrcode('reader');

      try {
        await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (text) => {
          document.getElementById('result').innerHTML = `
            <p><strong>Hasil scan:</strong> ${esc(text)}</p>
          `;
        });
      } catch (e) {
        document.getElementById('result').innerHTML = '<p>Camera tidak bisa diakses. Izinkan akses kamera lalu coba lagi.</p>';
        scanner = null;
      }
    }

    document.getElementById('q').addEventListener('input', render);
    render();
  </script>
</body>
</html>
