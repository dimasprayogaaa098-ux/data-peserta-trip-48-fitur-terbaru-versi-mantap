const $ = id => document.getElementById(id);
let scanner = null, scannerRunning = false;
function esc(value){return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function show(id){["list","detail","scan"].forEach(sectionId=>$(sectionId).classList.toggle("hidden",sectionId!==id));}
function render(){
 const query=$("q").value.trim().toLowerCase();
 const rows=participants.filter(person=>Object.values(person).join(" ").toLowerCase().includes(query));
 $("total").textContent="("+rows.length+"/"+participants.length+")";
 if(!rows.length){$("cards").innerHTML='<div class="card">Data peserta tidak ditemukan.</div>';return;}
 $("cards").innerHTML=rows.map(person=>`<article class="card"><h3>${esc(person["Nama"])}</h3><p><strong>${esc(person["No Peserta"])}</strong></p><p>${esc(person["Perusahaan/Divisi"])}</p><p>${esc(person["Bus"])} • Seat ${esc(person["Seat"])}</p><button type="button" class="btnDetail" data-id="${esc(person["No Peserta"])}">Detail + QR</button></article>`).join("");
 document.querySelectorAll(".btnDetail").forEach(button=>button.addEventListener("click",()=>showDetail(button.dataset.id)));
}
function showDetail(id){
 const person=participants.find(item=>item["No Peserta"]===id); if(!person)return;
 show("detail");
 const rows=Object.entries(person).map(([key,value])=>`<tr><th>${esc(key)}</th><td>${esc(value)}</td></tr>`).join("");
 $("detail").innerHTML=`<button type="button" id="btnBack" class="secondary">← Kembali</button><h2>${esc(person["Nama"])}</h2><table>${rows}</table><h3 style="text-align:center">QR Code Pribadi</h3><div id="qr"></div>`;
 $("btnBack").addEventListener("click",()=>show("list"));
 if(typeof QRCode!=="undefined")new QRCode($("qr"),{text:person["No Peserta"],width:220,height:220});
 else $("qr").textContent="QR Code gagal dimuat.";
}
async function startScan(){
 if(scannerRunning)return;
 if(typeof Html5Qrcode==="undefined"){$("result").textContent="Library scanner belum dimuat. Refresh halaman.";return;}
 scanner=new Html5Qrcode("reader");$("result").textContent="Meminta izin kamera...";
 try{
  await scanner.start({facingMode:"environment"},{fps:10,qrbox:250},decodedText=>{$("result").innerHTML="<strong>QR terbaca:</strong> "+esc(decodedText);},()=>{});
  scannerRunning=true;$("result").textContent="Kamera aktif. Arahkan ke QR peserta.";
 }catch(error){scanner=null;scannerRunning=false;$("result").textContent="Kamera tidak bisa dibuka. Izinkan kamera dan gunakan HTTPS.";}
}
async function stopScan(){
 if(!scanner)return;
 try{if(scannerRunning)await scanner.stop();scanner.clear();}catch(error){console.warn("Scanner sudah berhenti.",error);}
 scanner=null;scannerRunning=false;$("reader").innerHTML="";$("result").textContent="Kamera dimatikan.";
}
$("btnList").addEventListener("click",()=>show("list"));
$("btnScan").addEventListener("click",()=>show("scan"));
$("btnStartCamera").addEventListener("click",startScan);
$("btnStopCamera").addEventListener("click",stopScan);
$("q").addEventListener("input",render);
render();
